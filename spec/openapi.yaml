components:
  schemas:
    ServiceCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
          minimum: 0
          multipleOf: 0.01
        durationMinutes:
          type: integer
          minimum: 1
      required:
      - name
      - description
      - price
      - durationMinutes
      example:
        name: Стрижка
        description: Стрижка волосся
        price: 500
        durationMinutes: 60
    ServicePatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
          minimum: 0
          multipleOf: 0.01
        durationMinutes:
          type: integer
          minimum: 1
        active:
          type: boolean
      minProperties: 1
      example:
        active: false
    Service:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          example: svc-1
        name:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
          minimum: 0
          multipleOf: 0.01
        durationMinutes:
          type: integer
          minimum: 1
        currency:
          type: string
          enum:
          - UAH
        active:
          type: boolean
      required:
      - id
      - name
      - description
      - price
      - durationMinutes
      - currency
      - active
      example:
        id: svc-1
        name: Стрижка
        description: Стрижка волосся
        price: 500
        durationMinutes: 60
        currency: UAH
        active: true
    MasterCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        serviceIds:
          type: array
          items:
            type: string
            minLength: 1
            example: svc-1
          uniqueItems: true
      required:
      - name
      - serviceIds
      example:
        name: Олена
        serviceIds:
        - svc-1
    MasterPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        serviceIds:
          type: array
          items:
            type: string
            minLength: 1
            example: svc-1
          uniqueItems: true
        active:
          type: boolean
      minProperties: 1
      example:
        serviceIds:
        - svc-1
    Master:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          example: svc-1
        name:
          type: string
          minLength: 1
        serviceIds:
          type: array
          items:
            type: string
            minLength: 1
            example: svc-1
          uniqueItems: true
        active:
          type: boolean
      required:
      - id
      - name
      - serviceIds
      - active
      example:
        id: master-1
        name: Олена
        serviceIds:
        - svc-1
        active: true
