openapi: 3.0.3
info:
  title: Beauty Salon — проєкт REST API, лабораторна №4
  version: 0.1.0
  description: 'Проєкт контракту на основі SRS 1.0. Один салон. HTTP-рішення є проєктними,
    не новими затвердженими вимогами. Припущення: docs/lab4/addendum.md. Mock не виконує
    бізнес-логіку. Час Europe/Kyiv; RFC3339 містить offset. Статичні приклади мають
    умовний now=2026-10-20T12:00:00+03:00.'
servers:
- url: http://127.0.0.1:4010
  description: Локальний mock; лише синтетичні дані
paths:
  /users:
    post:
      operationId: registerClient
      summary: registerClient
      description: Публічна реєстрація лише клієнта; роль не приймається з тіла.
      tags:
      - users
      x-requirement-ids:
      - REQ-F-005
      - REQ-F-006
      x-roles:
      - public
      security: []
      responses:
        '201':
          description: Успішно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                success:
                  value:
                    id: client-1
                    name: Тестовий клієнт
                    phone: '+380000000000'
                    email: client@example.test
                    role: client
        '400':
          $ref: '#/components/responses/Error400'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '409':
          description: Операція конфліктує з поточними даними.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                EMAIL_IN_USE:
                  value:
                    code: EMAIL_IN_USE
                    message: Email вже використовується.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
            example:
              name: Тестовий клієнт
              phone: '+380000000000'
              email: client@example.test
              password: mock-only-password
  /sessions:
    post:
      operationId: login
      summary: login
      description: Вхід клієнта або адміністратора; спосіб створення адміністратора
        поза цим контрактом.
      tags:
      - sessions
      x-requirement-ids:
      - REQ-F-007
      - REQ-F-010
      x-roles:
      - public
      security: []
      responses:
        '200':
          description: Успішно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                success:
                  value:
                    accessToken: mock-token
                    tokenType: Bearer
                    user:
                      id: client-1
                      name: Тестовий клієнт
                      phone: '+380000000000'
                      email: client@example.test
                      role: client
        '400':
          $ref: '#/components/responses/Error400'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '409':
          $ref: '#/components/responses/Error409'
        '401':
          description: Потрібен вхід або правильні облікові дані.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                INVALID_CREDENTIALS:
                  value:
                    code: INVALID_CREDENTIALS
                    message: Неправильний email або пароль.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            example:
              email: client@example.test
              password: mock-only-password
  /services:
