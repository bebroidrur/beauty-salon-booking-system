      - status
      - category
      description: category обчислюється за скасуванням або розрахованим завершенням;
        не є фактом виконання послуги.
      example:
        id: booking-1
        clientId: client-1
        serviceId: svc-1
        masterId: master-1
        startsAt: '2026-10-26T10:00:00+02:00'
        masterName: Олена
        serviceSnapshot:
          name: Стрижка
          price: 500
          currency: UAH
          durationMinutes: 60
        endsAt: '2026-10-26T11:00:00+02:00'
        status: confirmed
        category: current
    ServiceList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Service'
      required:
      - items
      example:
        items:
        - id: svc-1
          name: Стрижка
          description: Стрижка волосся
          price: 500
          durationMinutes: 60
          currency: UAH
          active: true
    MasterList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Master'
      required:
      - items
      example:
        items:
        - id: master-1
          name: Олена
          serviceIds:
          - svc-1
          active: true
    BookingList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
      required:
      - items
      example:
        items:
        - id: booking-1
          clientId: client-1
          serviceId: svc-1
          masterId: master-1
          startsAt: '2026-10-26T10:00:00+02:00'
          masterName: Олена
          serviceSnapshot:
            name: Стрижка
            price: 500
            currency: UAH
            durationMinutes: 60
          endsAt: '2026-10-26T11:00:00+02:00'
          status: confirmed
          category: current
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
      required:
      - code
      - message
      description: Єдина модель помилки. Без персональних даних, stack trace, SQL
        або внутрішніх ідентифікаторів реалізації.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Проєктна домовленість; не визначає JWT або спосіб зберігання. Ролі
        перевіряються окремо.
  responses:
    Error400:
      description: Некоректні параметри запиту.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            default:
              value:
                code: INVALID_REQUEST
                message: Некоректні параметри запиту.
    Error401:
      description: Потрібен вхід або правильні облікові дані.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            default:
              value:
                code: UNAUTHENTICATED
                message: Потрібен вхід або правильні облікові дані.
    Error403:
      description: Операція недоступна для цього користувача.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            default:
              value:
                code: FORBIDDEN
                message: Операція недоступна для цього користувача.
    Error404:
      description: Ресурс не знайдено.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            default:
              value:
                code: NOT_FOUND
                message: Ресурс не знайдено.
    Error409:
      description: Операція конфліктує з поточними даними.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            default:
              value:
                code: CONFLICT
                message: Операція конфліктує з поточними даними.
    Error422:
      description: Дані не відповідають схемі або правилам.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            default:
              value:
                code: VALIDATION_ERROR
                message: Дані не відповідають схемі або правилам.
    Error500:
      description: Не вдалося обробити запит.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            default:
              value:
                code: INTERNAL_ERROR
                message: Не вдалося обробити запит.
