          phone: '+380000000000'
          email: client@example.test
          role: client
    WorkInterval:
      type: object
      additionalProperties: false
      properties:
        start:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        end:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      required:
      - start
      - end
      description: Один інтервал, start < end; перевірка співвідношення — семантична.
    Day:
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          working:
            type: boolean
            enum:
            - false
        required:
        - working
      - type: object
        additionalProperties: false
        properties:
          working:
            type: boolean
            enum:
            - true
          interval:
            $ref: '#/components/schemas/WorkInterval'
        required:
        - working
        - interval
    Week:
      type: object
      additionalProperties: false
      properties:
        monday:
          $ref: '#/components/schemas/Day'
        tuesday:
          $ref: '#/components/schemas/Day'
        wednesday:
          $ref: '#/components/schemas/Day'
        thursday:
          $ref: '#/components/schemas/Day'
        friday:
          $ref: '#/components/schemas/Day'
        saturday:
          $ref: '#/components/schemas/Day'
        sunday:
          $ref: '#/components/schemas/Day'
      required:
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
      - sunday
    ScheduleException:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        kind:
          type: string
          enum:
          - vacation
          - day_off
          - changed_hours
        day:
          $ref: '#/components/schemas/Day'
      required:
      - date
      - kind
      - day
      description: 'vacation/day_off: working=false; changed_hours: working=true.
        Семантична перевірка, не реалізація.'
