                    durationMinutes: 60
                    currency: UAH
                    active: false
        '400':
          $ref: '#/components/responses/Error400'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          description: Операція конфліктує з поточними даними.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                CURRENT_BOOKINGS_CONFLICT:
                  value:
                    code: CURRENT_BOOKINGS_CONFLICT
                    message: Спочатку змініть або скасуйте конфліктні актуальні записи.
      parameters:
      - name: serviceId
        in: path
        required: true
        description: serviceId
        schema:
          type: string
          minLength: 1
          example: svc-1
        example: svc-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePatch'
            example:
              active: false
    delete:
      operationId: deleteService
      summary: deleteService
      description: Фізичне видалення. За пов’язаних актуальних записів 409. Збереження
        історії при видаленні — відкрите D-06, не підтверджене mock.
